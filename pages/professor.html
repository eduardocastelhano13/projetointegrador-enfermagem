<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CONECTA – Painel do professor</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="apple-touch-icon" href="../assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@800&family=Sen&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="../assets/logo.png" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/painel.css" />
    <link rel="stylesheet" href="../css/aluno.css" />
    <link rel="stylesheet" href="../css/janelas.css" />
    <link rel="stylesheet" href="../css/professor.css" />
    <script>
      // Esconde o painel até a mensagem de boas-vindas aparecer (só no primeiro acesso da sessão)
      try {
        if (!sessionStorage.getItem("conecta_boas_vindas_prof")) {
          document.documentElement.classList.add("boas-vindas-ativa");
          setTimeout(function () {
            document.documentElement.classList.remove("boas-vindas-ativa");
          }, 6000);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="menu">
        <a class="marca" href="#/"
          ><img
            src="../assets/logo.png"
            alt="CONECTA – Prontuário Digital de Enfermagem"
        /></a>
        <nav id="nav" aria-label="Principal"></nav>
        <div class="usuario">
          <span class="avatar f" id="inicial" aria-hidden="true"></span>
          <div><b id="nome"></b><small>Professor(a)</small></div>
          <button
            id="sair"
            type="button"
            aria-label="Sair"
            title="Sair"
          ></button>
        </div>
      </aside>
      <main class="principal" id="tela"><p class="vazio">Carregando…</p></main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/medicamentos.js"></script>
    <script src="../js/professor.js"></script>
  </body>
</html>
